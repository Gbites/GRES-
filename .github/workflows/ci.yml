name: GRES CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax check
        run: |
          find src public/js tests server.js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run E2E test suite
        run: npm test
